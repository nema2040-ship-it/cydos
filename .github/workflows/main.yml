name: Build CYDOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://githubusercontent.com | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Install ESP32 Core
        run: |
          U1="https://githubusercontent.com"
          U2="espressif/arduino-esp32/gh-pages/"
          U3="package_esp32_index.json"
          arduino-cli core update-index --additional-urls "${U1}${U2}${U3}"
          arduino-cli core install esp32:esp32 --additional-urls "${U1}${U2}${U3}"

      - name: Build Firmware
        run: |
          mkdir -p /tmp/cydos_out
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --build-path /tmp/cydos_out firmware/cydos

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cydos-firmware
          path: /tmp/cydos_out/*.bin
          
