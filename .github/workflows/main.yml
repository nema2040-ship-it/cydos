name: Build CYDOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          URL=$(echo "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2VzcHJlc3NpZi9hcmR1aW5vLWVzcDMyL2doLXBhZ2VzL3BhY2thZ2VfZXNwMzJfaW5kZXguanNvbg==" | base64 -d)
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32 --additional-urls "$URL"

      - name: Build Firmware
        run: |
          mkdir -p /tmp/cydos_out
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --build-path /tmp/cydos_out firmware/cydos

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cydos-firmware
          path: /tmp/cydos_out/*.bin
